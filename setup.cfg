[metadata]
name = salsbury-md-analysis
version = 0.1.0
description = Reproducible molecular-dynamics trajectory analysis tools from the Salsbury group
long_description = file: README.md
long_description_content_type = text/markdown
author = Freddie R. Salsbury Jr.
author_email = 112109925+salsburygroup@users.noreply.github.com
url = https://github.com/salsburygroup/salsbury-md-analysis
license = BSD-3-Clause
license_files = LICENSE
classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Science/Research
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Topic :: Scientific/Engineering :: Chemistry
keywords = molecular dynamics, trajectory analysis, molecular simulation, reproducibility
project_urls =
    Documentation = https://github.com/salsburygroup/salsbury-md-analysis/tree/main/docs
    Source = https://github.com/salsburygroup/salsbury-md-analysis
    Issues = https://github.com/salsburygroup/salsbury-md-analysis/issues

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
include_package_data = True
install_requires =
    numpy>=2.0,<3
    scipy>=1.12,<2

[options.extras_require]
clustering =
    scikit-learn>=1.6,<2
hdbscan =
    hdbscan>=0.8.44,<0.9
openmm-connectivity =
    openmm>=8.5,<8.6

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    salsbury-md-analysis = salsbury_md_analysis.cli:main
