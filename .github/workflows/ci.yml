name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install -e '.[clustering,hdbscan]'
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Check generated documentation
        run: python scripts/generate_docs.py --check
      - name: Build wheel
        run: python -m pip wheel --no-deps . --wheel-dir dist
      - name: Exercise installed command
        run: salsbury-md-analysis list-modules --json
