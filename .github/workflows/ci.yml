name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install -e '.[clustering,hdbscan]'
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Check generated documentation
        run: python scripts/generate_docs.py --check
      - name: Build wheel
        run: python -m pip wheel --no-deps . --wheel-dir dist
      - name: Exercise installed command
        run: salsbury-md-analysis list-modules --json

  package-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build frontend
        run: python -m pip install build
      - name: Build source archive and wheel
        run: python -m build
      - name: Install wheel in an isolated environment
        run: |
          python -m venv artifact-venv
          artifact-venv/bin/python -m pip install dist/*.whl
          artifact-venv/bin/salsbury-md-analysis list-modules --json
      - name: Record artifact hashes
        run: sha256sum dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: salsbury-md-analysis-${{ github.sha }}-artifacts
          path: dist/*
